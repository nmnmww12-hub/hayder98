<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Pro</title>

<style>
body {
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
}

.header {
text-align:center;
padding:15px;
font-size:22px;
font-weight:bold;
background:#111827;
}

.tabs {
display:flex;
justify-content:space-around;
background:#111827;
padding:10px;
position:fixed;
bottom:0;
width:100%;
}

.tabs button {
background:none;
border:none;
color:white;
font-size:14px;
}

.page {display:none;padding:10px;}
.active {display:block;}

.card {
background:#1c2742;
padding:15px;
border-radius:12px;
margin:10px 0;
}

.match {
display:flex;
justify-content:space-between;
align-items:center;
}

.live {
color:red;
font-size:12px;
}

iframe {
width:100%;
height:200px;
border-radius:10px;
margin-top:10px;
}
</style>

</head>

<body>

<div class="header">⚽ Football Pro 2026</div>

<!-- الصفحات -->

<div id="matches" class="page active">

<div class="card">
<div class="match">
<span>ريال مدريد</span>
<span class="live">LIVE 🔴</span>
<span>برشلونة</span>
</div>
</div>

<div class="card">
<div class="match">
<span>ليفربول</span>
<span>8:30 PM</span>
<span>مانشستر سيتي</span>
</div>
</div>

<div class="card">
<div class="match">
<span>الزوراء</span>
<span>5:00 PM</span>
<span>القوة الجوية</span>
</div>
</div>

</div>

<div id="news" class="page">
<div class="card">🔥 ريال مدريد يتصدر الدوري</div>
<div class="card">⚡ انتقالات قوية هذا الموسم</div>
<div class="card">🏆 دوري الأبطال يشتعل</div>
</div>

<div id="videos" class="page">
<iframe src="https://www.youtube.com/embed/ysz5S6PUM-U"></iframe>
<iframe src="https://www.youtube.com/embed/aqz-KE-bpKQ"></iframe>
</div>

<div id="table" class="page">
<div class="card">1 - ريال مدريد</div>
<div class="card">2 - برشلونة</div>
<div class="card">3 - مانشستر سيتي</div>
<div class="card">4 - بايرن ميونخ</div>
</div>

<!-- القائمة -->
<div class="tabs">
<button onclick="show('matches')">⚽ مباريات</button>
<button onclick="show('news')">📰 أخبار</button>
<button onclick="show('videos')">🎥 فيديو</button>
<button onclick="show('table')">📊 ترتيب</button>
</div>

<script>
function show(id){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById(id).classList.add('active');
}
</script>

</body>
</html>
