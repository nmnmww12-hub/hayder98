<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Pro</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b1c2c;
  color:white;
}

.header {
  background:#081826;
  padding:15px;
  text-align:center;
  font-size:20px;
}

.match {
  background:#132f4c;
  margin:10px;
  padding:15px;
  border-radius:10px;
  cursor:pointer;
}

.servers button {
  margin:5px;
  padding:10px;
  background:#1f4e79;
  border:none;
  color:white;
  border-radius:5px;
}

video {
  width:100%;
  height:220px;
  background:black;
}

</style>
</head>

<body>

<div class="header">⚽ Football Live Pro</div>

<div id="matches">

<div class="match" onclick="openMatch('Real vs Barca')">
🔥 ريال مدريد vs برشلونة
</div>

<div class="match" onclick="openMatch('City vs Liverpool')">
🔥 مانشستر سيتي vs ليفربول
</div>

</div>

<div id="player"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>

function openMatch(name){
  document.getElementById("player").innerHTML = `
    <h3>${name}</h3>

    <div class="servers">
      <button onclick="playStream(1)">Server 1</button>
      <button onclick="playStream(2)">Server 2</button>
      <button onclick="playStream(3)">Server 3</button>
    </div>

    <video id="video" controls autoplay></video>
  `;
}

function playStream(server){

  let url = "";

  if(server == 1){
    url = "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";
  }

  if(server == 2){
    url = "https://test-streams.mux.dev/test_001/stream.m3u8";
  }

  if(server == 3){
    url = "https://test-streams.mux.dev/bbb-360p.m3u8";
  }

  var video = document.getElementById("video");

  if(Hls.isSupported()){
    var hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
  } else {
    video.src = url;
  }

}

</script>

</body>
</html>
