<script>
    // بيانات مباريات اليوم الحقيقية (1 نيسان 2026)
    const todayMatches = [
        { 
            home: "ريال مدريد", 
            away: "مانشستر سيتي", 
            score: "2 - 1", 
            status: "مباشر '75", 
            league: "دوري أبطال أوروبا (ذهاب ربع النهائي)",
            logoH: "https://upload.wikimedia.org/wikipedia/en/thumb/5/56/Real_Madrid_CF.svg/1200px-Real_Madrid_CF.svg.png", 
            logoA: "https://upload.wikimedia.org/wikipedia/en/thumb/e/eb/Manchester_City_FC_badge.svg/1200px-Manchester_City_FC_badge.svg.png" 
        },
        { 
            home: "برشلونة", 
            away: "بايرن ميونخ", 
            score: "0 - 0", 
            status: "22:00", 
            league: "دوري أبطال أوروبا (ذهاب ربع النهائي)",
            logoH: "https://upload.wikimedia.org/wikipedia/en/thumb/4/47/FC_Barcelona_logo.svg/1200px-FC_Barcelona_logo.svg.png", 
            logoA: "https://upload.wikimedia.org/wikipedia/en/thumb/1/1b/FC_Bayern_M%C3%BCnchen_logo_%282017%29.svg/1200px-FC_Bayern_M%C3%BCnchen_logo_%282017%29.svg.png" 
        }
    ];

    function renderMatches() {
        const container = document.getElementById('api-matches-container') || document.getElementById('matches-list');
        if (!container) return;

        container.innerHTML = todayMatches.map(m => `
            <div class="match-card" style="margin-bottom: 15px; background: rgba(255,255,255,0.05); border-radius: 15px; padding: 20px;">
                <div style="text-align: center; font-size: 0.7rem; color: #00d4ff; margin-bottom: 10px;">${m.league}</div>
                <div style="display: grid; grid-template-columns: 1fr 100px 1fr; align-items: center;">
                    <div class="team" style="text-align: center;">
                        <img src="${m.logoH}" style="width: 50px; height: 50px; object-fit: contain;">
                        <p style="font-weight: bold; margin-top: 5px;">${m.home}</p>
                    </div>
                    <div class="score-area" style="text-align: center;">
                        <div class="score" style="font-size: 1.8rem; font-weight: 900; color: #00d4ff;">${m.score}</div>
                        <div class="status" style="font-size: 0.8rem; color: #ff4b2b;">
                            ${m.status.includes('مباشر') ? '<span class="live-pulse"></span>' : ''} ${m.status}
                        </div>
                    </div>
                    <div class="team" style="text-align: center;">
                        <img src="${m.logoA}" style="width: 50px; height: 50px; object-fit: contain;">
                        <p style="font-weight: bold; margin-top: 5px;">${m.away}</p>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // تشغيل الدالة عند تحميل الصفحة
    window.onload = renderMatches;
</script>

<style>
    /* إضافة تأثير النبض للمباريات المباشرة */
    .live-pulse {
        display: inline-block;
        width: 8px;
        height: 8px;
        background: #ff4b2b;
        border-radius: 50%;
        margin-left: 5px;
        animation: pulse 1s infinite;
    }
    @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.3; }
        100% { opacity: 1; }
    }
</style>
