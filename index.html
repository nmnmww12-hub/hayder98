<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Pro MAX</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1a2f;
color:white;
text-align:center;
}

h1{padding:15px;}

.buttons{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
}

button{
background:#2e5bff;
border:none;
padding:10px 15px;
border-radius:10px;
color:white;
font-size:16px;
}

.card{
background:#1e2b45;
margin:10px;
padding:15px;
border-radius:15px;
}

iframe{
width:100%;
height:300px;
border-radius:10px;
border:none;
}
</style>
</head>

<body>

<h1>⚽ Football Pro MAX</h1>

<div class="buttons">
<button onclick="live()">🔴 مباشر</button>
<button onclick="results()">📅 نتائج</button>
<button onclick="goals()">🎬 أهداف</button>
</div>

<div id="content"></div>

<script>

// 🔴 بث مباشر + مباريات
function live(){
document.getElementById("content").innerHTML = `
<div class="card">
<h3>📺 مباريات مباشرة</h3>
<iframe src="https://www.scorebat.com/embed/livescore/"></iframe>
</div>
`;
}

// 📅 نتائج حقيقية
function results(){
document.getElementById("content").innerHTML = `
<div class="card">
<h3>🇮🇶 العراق 🆚 بوليفيا</h3>
<p>🏆 تصفيات كأس العالم</p>
<p>📊 2 - 1</p>
</div>

<div class="card">
<h3>🇺🇸 USA 🆚 🇧🇪 Belgium</h3>
<p>📊 2 - 5</p>
</div>

<div class="card">
<h3>🇲🇽 Mexico 🆚 🇵🇹 Portugal</h3>
<p>📊 1 - 2</p>
</div>
`;
}

// 🎬 فيديوهات حقيقية (تتحدث تلقائي)
function goals(){
document.getElementById("content").innerHTML = `
<div class="card">
<h3>🔥 أهداف اليوم</h3>
<iframe src="https://www.scorebat.com/embed/video/"></iframe>
</div>
`;
}

// تشغيل أولي
live();

</script>

</body>
</html>
