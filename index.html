<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Pro MAX 2026</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #050c16;
            --sidebar-bg: #0b1e33;
            --accent: #00d4ff;
            --text-white: #ffffff;
            --text-gray: #a0aec0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        aside {
            width: 80px;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            border-left: 1px solid rgba(255,255,255,0.05);
        }

        .logo-box { color: var(--accent); margin-bottom: 40px; font-size: 2rem; }

        .nav-link {
            color: var(--text-gray);
            font-size: 1.2rem;
            margin-bottom: 30px;
            cursor: pointer;
            transition: 0.3s;
            padding: 10px;
            border-radius: 12px;
        }

        .nav-link.active {
            background: rgba(0, 212, 255, 0.1);
            color: var(--accent);
            box-shadow: inset 0 0 10px rgba(0,212,255,0.2);
        }

        /* Main Content */
        main {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 50px;
        }

        header {
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 30, 51, 0.5);
            backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100;
        }

        .header-info h2 { font-size: 1rem; color: var(--accent); }
        .search-mini {
            background: rgba(255,255,255,0.05);
            padding: 5px 15px;
            border-radius: 20px;
            display: flex; align-items: center; gap: 10px;
        }
        .search-mini input { background: none; border: none; color: white; outline: none; width: 100px; }

        .container { padding: 20px; max-width: 800px; margin: 0 auto; }

        h1 { font-size: 1.8rem; margin: 20px 0; text-align: center; }

        /* Match Card */
        .match-card {
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr 100px 1fr;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .team { text-align: center; }
        .team img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 8px; }
        .team p { font-size: 0.9rem; font-weight: bold; }

        .score-area { text-align: center; }
        .score-box { font-size: 1.8rem; font-weight: 900; color: var(--accent); }
        .match-status { font-size: 0.7rem; color: #ff4b2b; font-weight: bold; }

        .live-pulse {
            display: inline-block; width: 8px; height: 8px; background: #ff4b2b;
            border-radius: 50%; margin-left: 5px; animation: pulse 1s infinite;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .video-placeholder {
            width: 100%; height: 200px; background: #000; border-radius: 15px;
            display: flex; align-items: center; justify-content: center; position: relative;
            overflow: hidden; margin-top: 10px;
        }
        .video-placeholder i { font-size: 3rem; color: white; opacity: 0.7; }

        footer { text-align: center; padding: 20px; font-size: 0.7rem; opacity: 0.5; }

        /* Tab Logic */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <aside>
        <div class="logo-box"><i class="fas fa-futbol"></i></div>
        <div class="nav-link active" onclick="showTab('live', this)"><i class="fas fa-stopwatch"></i></div>
        <div class="nav-link" onclick="showTab('madrid', this)"><i class="fas fa-crown"></i></div>
        <div class="nav-link" onclick="showTab('videos', this)"><i class="fas fa-play-circle"></i></div>
        <div class="nav-link" onclick="showTab('table', this)"><i class="fas fa-table"></i></div>
    </aside>

    <main>
        <header>
            <div class="header-info">
                <h2>الأربعاء، 1 نيسان 2026</h2>
                <div style="font-size: 0.8rem;">أهلاً بك، Hayder98</div>
            </div>
            <div class="search-mini">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="بحث..">
            </div>
        </header>

        <div class="container">
            
            <div id="live" class="tab-content active">
                <h1>مباريات اليوم المباشرة</h1>
                <div id="matches-list">
                    </div>
                
                <h1 style="margin-top: 40px;">نتائج الأمس (31 مارس)</h1>
                <div class="match-card">
                    <div class="team">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Flag_of_Iraq.svg/125px-Flag_of_Iraq.svg.png">
                        <p>منتخب العراق</p>
                    </div>
                    <div class="score-area">
                        <div class="score-box">2 - 1</div>
                        <div class="match-status" style="color: var(--accent)">انتهت</div>
                    </div>
                    <div class="team">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/48/Flag_of_Bolivia.svg/125px-Flag_of_Bolivia.svg.png">
                        <p>منتخب بوليفيا</p>
                    </div>
                </div>
            </div>

            <div id="madrid" class="tab-content">
                <h1>ركن الملكي Real Madrid</h1>
                <div class="match-card" style="border: 1px solid var(--accent)">
                    <div class="team">
                        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/5/56/Real_Madrid_CF.svg/1200px-Real_Madrid_CF.svg.png">
                        <p>ريال مدريد</p>
                    </div>
                    <div class="score-area">
                        <div class="score-box">VS</div>
                        <div class="match-status" style="color:white">22:00</div>
                    </div>
                    <div class="team">
                        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/e/eb/Manchester_City_FC_badge.svg/1200px-Manchester_City_FC_badge.svg.png">
                        <p>مانشستر سيتي</p>
                    </div>
                </div>
            </div>

            <div id="videos" class="tab-content">
                <h1>ملخصات الأهداف</h1>
                <div class="video-placeholder">
                    <i class="fas fa-play"></i>
                    <div style="position:absolute; bottom:10px; right:15px; font-weight:bold;">ملخص فوز العراق 2-1</div>
                </div>
            </div>

        </div>

        <footer>
            © Football Pro MAX 2026 - تم التطوير بواسطة Hayder98
        </footer>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script>
        // إعدادات Firebase من صورتك بالضبط
        const firebaseConfig = {
            apiKey: "AIzaSyAi54sRTeJS_RhcAWJqlYAC95v4ZuQ0kGQ",
            authDomain: "football-pro-max.firebaseapp.com",
            projectId: "football-pro-max",
            storageBucket: "football-pro-max.appspot.com",
            messagingSenderId: "314060630253",
            appId: "1:314060630253:web:6619cd79f92f335f8284e4",
            measurementId: "G-H952BJJGXV"
        };
        firebase.initializeApp(firebaseConfig);

        function showTab(id, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        // نظام المحاكاة الذكي لجعل الموقع "جاهزاً" بدون أخطاء
        const demoMatches = [
            { home: "برشلونة", away: "ريال مدريد", score: "1 - 2", status: "مباشر 75'", imgH: "https://upload.wikimedia.org/wikipedia/en/thumb/4/47/FC_Barcelona_logo.svg/1200px-FC_Barcelona_logo.svg.png", imgA: "https://upload.wikimedia.org/wikipedia/en/thumb/5/56/Real_Madrid_CF.svg/1200px-Real_Madrid_CF.svg.png" },
            { home: "ميلان", away: "إنتر ميلان", score: "0 - 0", status: "21:45", imgH: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d0/Logo_of_AC_Milan.svg/1200px-Logo_of_AC_Milan.svg.png", imgA: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/FC_Internazionale_Milano_2021.svg/1200px-FC_Internazionale_Milano_2021.svg.png" }
        ];

        function loadMatches() {
            const list = document.getElementById('matches-list');
            list.innerHTML = demoMatches.map(m => `
                <div class="match-card">
                    <div class="team">
                        <img src="${m.imgH}">
                        <p>${m.home}</p>
                    </div>
                    <div class="score-area">
                        <div class="score-box">${m.score}</div>
                        <div class="match-status">
                            ${m.status.includes('مباشر') ? '<span class="live-pulse"></span>' + m.status : m.status}
                        </div>
                    </div>
                    <div class="team">
                        <img src="${m.imgA}">
                        <p>${m.away}</p>
                    </div>
                </div>
            `).join('');
        }

        window.onload = loadMatches;
    </script>
</body>
</html>
