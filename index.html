<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Pro MAX</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

/* الهيدر */
.header{
  background:#0b132b;
  padding:15px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

/* الأزرار */
.buttons{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  padding:15px;
}

.btn{
  background:#2563eb;
  padding:10px 15px;
  border-radius:10px;
}

/* البحث */
.search{
  margin:10px;
  padding:10px;
  width:90%;
  border-radius:10px;
  border:none;
  display:block;
  margin-left:auto;
  margin-right:auto;
}

/* الكروت */
.match{
  background:#1e293b;
  margin:10px;
  padding:15px;
  border-radius:12px;
}
</style>
</head>

<body>

<div class="header">⚽ Football Pro MAX</div>

<div class="buttons">
  <div class="btn">🏆 الكل</div>
  <div class="btn">🔥 الأبطال</div>
  <div class="btn">🇪🇸 اسباني</div>
  <div class="btn">🏴 انجليزي</div>
  <div class="btn">🔴 مباشر</div>
  <div class="btn">📊 ترتيب</div>
</div>

<input class="search" placeholder="🔍 ابحث عن فريق...">

<!-- هنا راح تنعرض المباريات -->
<div id="apiMatches"></div>

<script>
async function loadRealMatches() {
  try {
    const res = await fetch('https://api-football-v1.p.rapidapi.com/v3/fixtures?live=all', {
      method: 'GET',
      headers: {
        'X-RapidAPI-Key': 'c14437f142msh2ab622a3c1b4063p12663ajsna8e3f9e211d5',
        'X-RapidAPI-Host': 'api-football-v1.p.rapidapi.com'
      }
    });

    const data = await res.json();
    const matches = data.response;

    const container = document.getElementById("apiMatches");
    container.innerHTML = "";

    if (!matches || matches.length === 0) {
      container.innerHTML = "<p style='text-align:center'>ماكو مباريات حالياً</p>";
      return;
    }

    matches.forEach(match => {
      container.innerHTML += `
        <div class="match">
          <h3>${match.teams.home.name} 🆚 ${match.teams.away.name}</h3>
          <p>${match.league.name}</p>
          <p>⏱ ${match.fixture.status.elapsed || 0} دقيقة</p>
        </div>
      `;
    });

  } catch (e) {
    console.log(e);
  }
}

loadRealMatches();
</script>

</body>
</html>
