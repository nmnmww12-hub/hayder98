<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Pro MAX</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
}

.header{
  background:#0f172a;
  padding:15px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  padding:15px;
}

.btn{
  background:#2563eb;
  padding:10px 15px;
  border-radius:10px;
}

.search{
  padding:10px;
  margin:10px;
  width:90%;
  border-radius:10px;
  border:none;
}

.match{
  background:#1e293b;
  margin:10px;
  padding:15px;
  border-radius:12px;
}
</style>

</head>

<body>

<div class="header">⚽ Football Pro MAX</div>

<div class="buttons">
  <div class="btn">🏆 الكل</div>
  <div class="btn">🔥 الأبطال</div>
  <div class="btn">🇪🇸 اسباني</div>
  <div class="btn">🏴 انجليزي</div>
  <div class="btn">🔴 مباشر</div>
  <div class="btn">📊 ترتيب</div>
</div>

<input class="search" placeholder="🔎 ابحث عن فريق...">

<!-- 🔥 هنا راح تظهر المباريات -->
<div id="liveMatches"></div>

<script>
async function loadMatches() {
  const res = await fetch('https://api-football-v1.p.rapidapi.com/v3/fixtures?live=all', {
    method: 'GET',
    headers: {
      'X-RapidAPI-Key': 'c14437f142msh2ab622a3c1b4063p12663ajsna8e3f9e211d5',
      'X-RapidAPI-Host': 'api-football-v1.p.rapidapi.com'
    }
  });

  const data = await res.json();
  const matches = data.response;

  const container = document.getElementById("liveMatches");
  container.innerHTML = "";

  matches.forEach(match => {
    container.innerHTML += `
      <div class="match">
        <h3>${match.teams.home.name} 🆚 ${match.teams.away.name}</h3>
        <p>⏱ ${match.fixture.status.elapsed || 0} دقيقة</p>
        <p>🏆 ${match.league.name}</p>
      </div>
    `;
  });
}

loadMatches();
</script>

</body>
</html>
