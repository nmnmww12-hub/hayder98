<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مباريات اليوم - مباشر</title>
    <style>
        body {
            background-color: #0b0e14; /* خلفية داكنة احترافية */
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
        }
        .header {
            text-align: center;
            padding: 15px;
            background: #1a1e26;
            margin-bottom: 15px;
            border-radius: 8px;
            font-weight: bold;
        }
        /* لضمان بقاء الإضافة داخل الصفحة بشكل مرتب */
        .widget-wrapper {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            min-height: 600px; /* يحجز مساحة حتى لا تظهر الصفحة بيضاء */
        }
    </style>
</head>
<body>

    <div class="header">⚽ جدول مباريات اليوم المباشر</div>

    <div class="widget-wrapper">
        <div id="sa-widget-matches" class="scoreaxis-widget"></div>
        <script>
            (function() {
                var script = document.createElement('script');
                script.src = "https://widgets.scoreaxis.com/api/football/fixtures-today?widgetId=sa-widget-matches&lang=ar&font=heebo&fontSize=14&bodyColor=%231a1e26&textColor=%23ffffff&linkColor=%2338bdf8&borderColor=%23334155&tabColor=%230b0e14&rowDensity=100&links=0"; // تم تعطيل الروابط الخارجية بـ links=0
                script.async = true;
                document.getElementById('sa-widget-matches').appendChild(script);
            })();
        </script>
    </div>

    <div style="text-align:center; font-size:11px; margin-top:20px; color:#555;">
        تحديث تلقائي للمباريات والنتائج
    </div>

</body>
</html>
