<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Football 26</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: black;
    color: white;
    text-align: center;
}

/* الصفحات */
.page {
    display: none;
    padding: 20px;
}
.active {
    display: block;
}

/* القائمة السفلية */
.menu {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #111;
    display: flex;
    justify-content: space-around;
    padding: 10px 0;
}

button {
    background: none;
    border: none;
    color: white;
    font-size: 20px;
}
</style>

</head>

<body>

<!-- الصفحات -->
<div id="home" class="page active">
    <h1>🏠 الرئيسية</h1>
    <p>مرحبا بك في Football 26</p>
</div>

<div id="matches" class="page">
    <h1>⚽ المباريات</h1>
    <p>لا توجد مباريات حالياً</p>
</div>

<div id="videos" class="page">
    <h1>🎬 الفيديوهات</h1>
    <p>قريباً...</p>
</div>

<div id="news" class="page">
    <h1>📰 الأخبار</h1>
    <p>أخبار الكرة هنا</p>
</div>

<div id="transfers" class="page">
    <h1>💰 الانتقالات</h1>
    <p>قريباً...</p>
</div>

<div id="analysis" class="page">
    <h1>📊 التحليل</h1>
    <p>تحليل المباريات</p>
</div>

<!-- القائمة -->
<div class="menu">
    <button onclick="showPage('home')">🏠</button>
    <button onclick="showPage('matches')">⚽</button>
    <button onclick="showPage('videos')">🎬</button>
    <button onclick="showPage('news')">📰</button>
    <button onclick="showPage('transfers')">💰</button>
    <button onclick="showPage('analysis')">📊</button>
</div>

<script>
function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}
</script>

</body>
</html>
