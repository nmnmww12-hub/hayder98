<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Football Pro App</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0b1220;
    color:white;
}

/* الصفحات */
.page {
    display:none;
    padding:15px;
}

.active {
    display:block;
}

/* المباراة */
.match {
    background:#111827;
    margin:10px 0;
    padding:15px;
    border-radius:15px;
}

/* الفرق */
.teams {
    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* القائمة */
.menu {
    position:fixed;
    bottom:0;
    width:100%;
    background:#111;
    display:flex;
    justify-content:space-around;
    padding:10px;
}

.menu button {
    background:none;
    border:none;
    color:#aaa;
    font-size:16px;
}
</style>

</head>

<body>

<!-- صفحة المباريات -->
<div id="matches" class="page active">
<h2>⚽ المباريات</h2>
<div id="matchesList">تحميل...</div>
</div>

<!-- صفحة الأخبار -->
<div id="news" class="page">
<h2>📰 الأخبار</h2>
<p>قريباً...</p>
</div>

<!-- صفحة الانتقالات -->
<div id="transfers" class="page">
<h2>💰 الانتقالات</h2>
<p>قريباً...</p>
</div>

<!-- صفحة التحليل -->
<div id="analysis" class="page">
<h2>📊 التحليل</h2>
<p>قريباً...</p>
</div>

<!-- القائمة -->
<div class="menu">
<button onclick="showPage('matches')">⚽</button>
<button onclick="showPage('news')">📰</button>
<button onclick="showPage('transfers')">💰</button>
<button onclick="showPage('analysis')">📊</button>
</div>

<script>
function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

/* تحميل مباريات */
async function loadMatches() {
    const url = "https://api.allorigins.win/raw?url=https://www.scorebat.com/video-api/v3/";

    try {
        const res = await fetch(url);
        const data = await res.json();

        let html = "";

        data.response.slice(0,10).forEach(match => {
            let teams = match.title.split(" - ");

            html += `
            <div class="match">
                <div class="teams">
                    <div>${teams[0]}</div>
                    <div>🔴 LIVE</div>
                    <div>${teams[1]}</div>
                </div>
                <button onclick="window.open('${match.matchviewUrl}')">
                    ▶️ مشاهدة
                </button>
            </div>
            `;
        });

        document.getElementById("matchesList").innerHTML = html;

    } catch {
        document.getElementById("matchesList").innerHTML = "خطأ بالتحميل";
    }
}
