<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>🔥 مباريات اليوم</title>

<style>
body{background:#111;color:#fff;text-align:center;font-family:Arial}
.box{background:#222;padding:15px;margin:20px;border-radius:10px}
a{display:block;background:red;color:#fff;padding:15px;margin:20px;border-radius:10px;text-decoration:none}
</style>

</head>
<body>

<h1>⚽ بث مباشر مباريات اليوم</h1>

<div class="box" id="timeBox">
⏰ جاري التحديث...
</div>

<a href="#">▶️ مشاهدة المباراة الآن</a>

<script>
function updateTime() {
    let now = new Date();
    document.getElementById("timeBox").innerHTML =
        "🔥 تحديث تلقائي<br>⏰ " + now.toLocaleString();
}

// أول تشغيل
updateTime();

// تحديث كل دقيقة
setInterval(updateTime, 60000);
</script>

</body>
</html>
