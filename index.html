<script>
const API_KEY = "c14437f142msh2ab622a3c1b4063p12663ajsna8e3f9e211d5"

/* =========================
   1. المباريات المباشرة
========================= */
async function loadLiveMatches() {
  const res = await fetch('https://api-football-v1.p.rapidapi.com/v3/fixtures?live=all', {
    headers: {
      'X-RapidAPI-Key': API_KEY,
      'X-RapidAPI-Host': 'api-football-v1.p.rapidapi.com'
    }
  });

  const data = await res.json();
  const matches = data.response;

  const container = document.getElementById("liveMatches");
  container.innerHTML = "<h2>🔴 مباشر</h2>";

  matches.forEach(match => {
    container.innerHTML += matchCard(match);
  });
}

/* =========================
   2. مباريات البارحة
========================= */
async function loadYesterday() {
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const date = yesterday.toISOString().split('T')[0];

  const res = await fetch(`https://api-football-v1.p.rapidapi.com/v3/fixtures?date=${date}`, {
    headers: {
      'X-RapidAPI-Key': API_KEY,
      'X-RapidAPI-Host': 'api-football-v1.p.rapidapi.com'
    }
  });

  const data = await res.json();
  const matches = data.response;

  const container = document.getElementById("yesterdayMatches");
  container.innerHTML = "<h2>📅 مباريات البارحة</h2>";

  matches.slice(0,10).forEach(match => {
    container.innerHTML += matchCard(match);
  });
}

/* =========================
   3. فيديو الأهداف (مجاني)
========================= */
async function loadVideos() {
  const res = await fetch("https://www.scorebat.com/video-api/v3/");
  const data = await res.json();

  const container = document.getElementById("videos");
  container.innerHTML = "<h2>🎥 أهداف المباريات</h2>";

  data.response.slice(0,5).forEach(video => {
    container.innerHTML += `
      <div style="margin:10px;background:#1e293b;padding:10px;border-radius:10px">
        <p>${video.title}</p>
        ${video.videos[0].embed}
      </div>
    `;
  });
}

/* =========================
   كارت المباراة
========================= */
function matchCard(match){
  return `
    <div style="background:#1e293b;margin:10px;padding:15px;border-radius:15px">
      <div style="display:flex;justify-content:space-between;align-items:center">

        <div style="text-align:center">
          <img src="${match.teams.home.logo}" width="40"><br>
          <small>${match.teams.home.name}</small>
        </div>

        <div style="text-align:center">
          <h3>${match.goals.home ?? 0} - ${match.goals.away ?? 0}</h3>
          <small>${match.fixture.status.short}</small>
        </div>

        <div style="text-align:center">
          <img src="${match.teams.away.logo}" width="40"><br>
          <small>${match.teams.away.name}</small>
        </div>

      </div>

      <p style="text-align:center;color:#aaa">${match.league.name}</p>
    </div>
  `;
}

/* =========================
   تشغيل الكل
========================= */
loadLiveMatches();
loadYesterday();
loadVideos();
</script>
