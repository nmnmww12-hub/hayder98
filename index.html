<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Pro MAX</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:white;
    text-align:center;
}

h1{
    padding:15px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
}

input{
    width:90%;
    padding:12px;
    margin:15px 0;
    border-radius:10px;
    border:none;
}

.card{
    background:#1e293b;
    margin:15px;
    padding:10px;
    border-radius:15px;
}

iframe{
    width:100%;
    height:200px;
    border:none;
    border-radius:10px;
}
</style>

</head>

<body>

<h1>⚽ Football Pro MAX</h1>

<div class="buttons">
<button onclick="loadLive()">🔴 مباشر</button>
<button onclick="loadYesterday()">📅 مباريات الأمس</button>
<button onclick="loadVideos()">🎥 أهداف</button>
</div>

<input type="text" id="search" placeholder="🔎 ابحث عن فريق..." onkeyup="searchTeam()">

<div id="content">⏳ جاري التحميل...</div>

<script>

// 🔥 حط مفتاحك هنا
const API_KEY = "c14437f142msh2ab622a3c1b4063p12663ajsna8e3f9e211d5"

// ================== مباريات مباشرة ==================
async function loadLive(){
    document.getElementById("content").innerHTML = "⏳ جاري تحميل المباريات...";

    try{
        let res = await fetch("https://v3.football.api-sports.io/fixtures?live=all",{
            headers:{
                "x-apisports-key": API_KEY
            }
        });

        let data = await res.json();
        let matches = data.response;

        if(matches.length === 0){
            document.getElementById("content").innerHTML = "❌ ماكو مباريات مباشرة";
            return;
        }

        let html = "";

        matches.forEach(m=>{
            html += `
            <div class="card">
                <h3>${m.teams.home.name} 🆚 ${m.teams.away.name}</h3>
                <p>${m.league.name}</p>
                <p>⏱ ${m.fixture.status.elapsed}'</p>
            </div>
            `;
        });

        document.getElementById("content").innerHTML = html;

    }catch(e){
        document.getElementById("content").innerHTML = "❌ خطأ بالاتصال";
    }
}

// ================== مباريات الأمس ==================
async function loadYesterday(){
    document.getElementById("content").innerHTML = "⏳ جاري التحميل...";

    let yesterday = new Date();
    yesterday.setDate(yesterday.getDate()-1);
    let date = yesterday.toISOString().split("T")[0];

    try{
        let res = await fetch(`https://v3.football.api-sports.io/fixtures?date=${date}`,{
            headers:{
                "x-apisports-key": API_KEY
            }
        });

        let data = await res.json();

        let html = "";

        data.response.slice(0,10).forEach(m=>{
            html += `
            <div class="card">
                <h3>${m.teams.home.name} ${m.goals.home} - ${m.goals.away} ${m.teams.away.name}</h3>
                <p>${m.league.name}</p>
            </div>
            `;
        });

        document.getElementById("content").innerHTML = html;

    }catch{
        document.getElementById("content").innerHTML = "❌ خطأ";
    }
}

// ================== فيديوهات ==================
async function loadVideos(){
    document.getElementById("content").innerHTML = "⏳ جاري تحميل الفيديوهات...";

    try{
        let res = await fetch("https://www.scorebat.com/video-api/v3/");
        let data = await res.json();

        let html = "";

        data.response.slice(0,10).forEach(v=>{
            html += `
            <div class="card">
                <h3>${v.title}</h3>
                ${v.embed}
            </div>
            `;
        });

        document.getElementById("content").innerHTML = html;

    }catch{
        document.getElementById("content").innerHTML = "❌ ماكو فيديوهات";
    }
}

// ================== البحث ==================
function searchTeam(){
    let input = document.getElementById("search").value.toLowerCase();
    let cards = document.querySelectorAll(".card");

    cards.forEach(card=>{
        if(card.innerText.toLowerCase().includes(input)){
            card.style.display="block";
        }else{
            card.style.display="none";
        }
    });
}

// تشغيل أولي
loadVideos();

</script>

</body>
</html>
