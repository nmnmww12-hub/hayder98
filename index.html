<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Pro</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b1220;
  color:white;
}

.header {
  text-align:center;
  padding:15px;
  background:black;
  font-size:20px;
}

.match {
  background:#16213e;
  margin:10px;
  padding:15px;
  border-radius:10px;
  cursor:pointer;
}

.player {
  width:100%;
  height:220px;
  background:black;
}

button {
  margin:5px;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#00bcd4;
  color:white;
}
</style>
</head>

<body>

<div class="header">⚽ Football Pro LIVE</div>

<video id="video" class="player" controls></video>

<div style="text-align:center;">
<button onclick="server1()">Server 1</button>
<button onclick="server2()">Server 2</button>
</div>

<div id="matches"></div>

<script>

// روابط تجريبية (تبدلها بعدين)
let streams = [
  "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
  "https://test-streams.mux.dev/test_001/stream.m3u8"
];

// مباريات تجريبية
let matches = [
  {team1:"برشلونة", team2:"ريال مدريد"},
  {team1:"ليفربول", team2:"مانشستر سيتي"},
  {team1:"الزوراء", team2:"القوة الجوية"}
];

function loadMatches(){
  let container = document.getElementById("matches");
  container.innerHTML = "";

  matches.forEach((m,i)=>{
    let div = document.createElement("div");
    div.className = "match";
    div.innerHTML = `⚽ ${m.team1} vs ${m.team2}`;
    div.onclick = ()=> playMatch(streams[i % streams.length]);
    container.appendChild(div);
  });
}

function playMatch(url){
  document.getElementById("video").src = url;
}

function server1(){
  alert("سيرفر 1 شغال");
}

function server2(){
  alert("سيرفر 2 شغال");
}

loadMatches();

</script>

</body>
</html>
