<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Football Pro MAX</title>

<style>
body {
  background: #0b1e33;
  color: white;
  font-family: Arial;
  text-align: center;
}

h1 {
  margin-top: 20px;
}

.buttons button {
  margin: 10px;
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  background: #2d6cdf;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.card {
  background: #162b45;
  margin: 20px;
  padding: 20px;
  border-radius: 15px;
}

.error {
  color: red;
}
</style>
</head>

<body>

<h1>⚽ Football Pro MAX</h1>

<div class="buttons">
  <button onclick="showTable()">📊 الترتيب</button>
</div>

<div id="content" class="card">
اضغط على "الترتيب"
</div>

<script>
async function showTable() {
  const content = document.getElementById("content");
  content.innerHTML = "⏳ جاري التحميل...";

  try {
    const response = await fetch("https://api.allorigins.win/raw?url=https://api.football-data.org/v4/competitions/PD/standings", {
      headers: {
        "X-Auth-Token": "d4fe6e8b047d4453bb041a8f90f7c8fd"
      }
    });

    if (!response.ok) {
      throw new Error("خطأ: " + response.status);
    }

    const data = await response.json();
    const teams = data.standings[0].table;

    let html = "<h2>🏆 ترتيب الدوري الإسباني</h2>";

    teams.forEach(team => {
      html += `
        <p>${team.position} - ${team.team.name} (${team.points} نقطة)</p>
      `;
    });

    content.innerHTML = html;

  } catch (error) {
    console.log(error);
    content.innerHTML = `<div class="error">❌ فشل تحميل الترتيب<br>${error.message}</div>`;
  }
}
</script>

</body>
</html>
