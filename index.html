<div id="matches" class="page active">
  <div id="matchesList">جاري تحميل المباريات...</div>
  <div id="player"></div>
</div>
<script>
async function loadMatches() {
  try {
    let res = await fetch("https://www.scorebat.com/video-api/v3/");
    let data = await res.json();

    let html = "";

    data.response.slice(0,10).forEach(match => {
      html += `
      <div class="card" onclick="playVideo('${match.videos[0].embed}')">
        ⚽ ${match.title}
      </div>
      `;
    });

    document.getElementById("matchesList").innerHTML = html;

  } catch (e) {
    document.getElementById("matchesList").innerHTML = "❌ خطأ بالتحميل";
  }
}

function playVideo(embed){
  document.getElementById("player").innerHTML = embed;
}

loadMatches();
</script>
