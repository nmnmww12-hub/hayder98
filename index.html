<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Pro</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b1c2c;
  color:white;
}

.header {
  text-align:center;
  padding:15px;
  font-size:20px;
  background:#081826;
}

.card {
  background:#132f4c;
  margin:10px;
  padding:15px;
  border-radius:10px;
  text-align:center;
  cursor:pointer;
}

iframe {
  width:100%;
  height:200px;
  border:none;
  margin-top:10px;
}

.nav {
  position:fixed;
  bottom:0;
  width:100%;
  background:#111;
  display:flex;
  justify-content:space-around;
  padding:10px;
}

.nav button {
  background:none;
  border:none;
  color:white;
  font-size:14px;
}

.page {display:none;}
.active {display:block;}
</style>
</head>

<body>

<div class="header">⚽ Football Live</div>

<!-- MATCHES -->
<div id="matches" class="page active">

  <div class="card" onclick="playVideo('https://www.youtube.com/embed/aqz-KE-bpKQ')">
    🔴 برشلونة vs ريال مدريد (اضغط للمشاهدة)
  </div>

  <div class="card" onclick="playVideo('https://www.youtube.com/embed/5qap5aO4i9A')">
    مانشستر سيتي vs ليفربول
  </div>

  <div id="player"></div>

</div>

<!-- NEWS -->
<div id="news" class="page">
  <div class="card">🔥 فوز ريال مدريد 3-1</div>
  <div class="card">⚽ صفقة جديدة لبرشلونة</div>
</div>

<!-- TABLE -->
<div id="table" class="page">
  <div class="card">🥇 ريال مدريد - 75 نقطة</div>
  <div class="card">🥈 برشلونة - 70 نقطة</div>
  <div class="card">🥉 مانشستر سيتي - 68 نقطة</div>
</div>

<!-- NAV -->
<div class="nav">
  <button onclick="showPage('matches')">⚽ مباريات</button>
  <button onclick="showPage('news')">📰 أخبار</button>
  <button onclick="showPage('table')">📊 ترتيب</button>
</div>

<script>
function showPage(page) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(page).classList.add("active");
}

function playVideo(url) {
  document.getElementById("player").innerHTML =
    `<iframe src="${url}" allowfullscreen></iframe>`;
}
</script>

</body>
</html>
