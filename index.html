<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Pro MAX</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
}

h1{
text-align:center;
padding:15px;
}

.buttons{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
}

button{
background:#2563eb;
border:none;
padding:10px 15px;
border-radius:10px;
color:white;
font-size:16px;
}

input{
width:90%;
margin:15px;
padding:12px;
border-radius:10px;
border:none;
font-size:16px;
}

.card{
background:#1e293b;
margin:10px;
padding:15px;
border-radius:15px;
}

.card img{
width:40px;
vertical-align:middle;
}

iframe{
width:100%;
height:200px;
border-radius:10px;
border:none;
}
</style>

</head>
<body>

<h1>⚽ Football Pro MAX</h1>

<div class="buttons">
<button onclick="loadLive()">🔴 مباشر</button>
<button onclick="loadYesterday()">📅 مباريات الأمس</button>
<button onclick="loadVideos()">🎬 أهداف</button>
</div>

<center>
<input type="text" id="search" placeholder="🔎 ابحث عن فريق..." onkeyup="searchTeam()">
</center>

<div id="content"></div>

<script>

const API_KEY = "c14437f142msh2ab622a3c1b4063p12663ajsna8e3f9e211d5"; // 🔥 حط مفتاحك هنا

// 🔴 مباشر
async function loadLive(){
let res = await fetch("https://v3.football.api-sports.io/fixtures?live=all",{
headers:{ "x-apisports-key": API_KEY }
});
let data = await res.json();
showMatches(data.response);
}

// 📅 مباريات الأمس + إضافة العراق
async function loadYesterday(){

let yesterday = new Date();
yesterday.setDate(yesterday.getDate()-1);
let date = yesterday.toISOString().split("T")[0];

let res = await fetch(`https://v3.football.api-sports.io/fixtures?date=${date}`,{
headers:{ "x-apisports-key": API_KEY }
});

let data = await res.json();
let matches = data.response;

// 🔥 إضافة مباراة العراق يدوي
matches.unshift({
teams:{
home:{name:"العراق", logo:"https://upload.wikimedia.org/wikipedia/commons/f/f6/Flag_of_Iraq.svg"},
away:{name:"بوليفيا", logo:"https://upload.wikimedia.org/wikipedia/commons/4/48/Flag_of_Bolivia.svg"}
},
league:{name:"تصفيات كأس العالم"},
fixture:{status:{elapsed:"90"}},
goals:{home:2, away:1}
});

// عرض المباريات
showMatches(matches);

// 🔥 إضافة فيديو خاص للمباراة
document.getElementById("content").innerHTML += `
<div class="card">
<h3>🎬 ملخص العراق vs بوليفيا</h3>
<iframe src="https://www.youtube.com/embed/aqz-KE-bpKQ"></iframe>
</div>
`;

}

// 🎬 فيديوهات عامة
async function loadVideos(){
let res = await fetch("https://www.scorebat.com/video-api/v3/");
let data = await res.json();

let html = "";

data.response.slice(0,10).forEach(v=>{
html += `
<div class="card">
<h3>${v.title}</h3>
${v.videos[0].embed}
</div>
`;
});

document.getElementById("content").innerHTML = html;
}

// عرض المباريات
function showMatches(matches){
let html = "";

if(matches.length === 0){
html = "<p style='text-align:center'>ماكو مباريات 😅</p>";
}

matches.slice(0,20).forEach(m=>{
html += `
<div class="card">
<h3>
<img src="${m.teams.home.logo}">
${m.teams.home.name}
🆚
${m.teams.away.name}
<img src="${m.teams.away.logo}">
</h3>

<p>🏆 ${m.league.name}</p>
<p>⏱ ${m.fixture.status.elapsed || "لم تبدأ"}</p>
<p>📊 ${m.goals.home ?? "-"} : ${m.goals.away ?? "-"}</p>
</div>
`;
});

document.getElementById("content").innerHTML = html;
}

// 🔎 البحث
function searchTeam(){
let input = document.getElementById("search").value.toLowerCase();
let cards = document.querySelectorAll(".card");

cards.forEach(card=>{
if(card.innerText.toLowerCase().includes(input)){
card.style.display="block";
}else{
card.style.display="none";
}
});
}

// تشغيل أولي
loadLive();

</script>

</body>
</html>
