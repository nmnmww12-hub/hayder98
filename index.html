<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Pro MAX</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1a2f;
color:white;
text-align:center;
}

h1{
padding:15px;
}

.buttons{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
}

button{
background:#2e5bff;
border:none;
padding:10px 15px;
border-radius:10px;
color:white;
font-size:16px;
}

input{
width:90%;
padding:12px;
margin:15px;
border-radius:10px;
border:none;
}

.card{
background:#1e2b45;
margin:10px;
padding:15px;
border-radius:15px;
}

iframe{
width:100%;
height:200px;
border-radius:10px;
border:none;
}
</style>
</head>

<body>

<h1>⚽ Football Pro MAX</h1>

<div class="buttons">
<button onclick="loadLive()">🔴 مباشر</button>
<button onclick="loadYesterday()">📅 مباريات الأمس</button>
<button onclick="loadVideos()">🎬 أهداف</button>
</div>

<input type="text" placeholder="🔎 ابحث عن فريق..." onkeyup="searchTeam()" id="search">

<div id="content"></div>

<script>

// 🔥 حط مفتاحك هنا
const API_KEY = "e861dd443e7485299d0ec782cb1e6de1";

// ================= مباريات اليوم =================
async function loadLive(){

let res = await fetch("https://sportsrc.org/v2/football/matches?live=true",{
headers:{
"x-api-key": API_KEY
}
});

let data = await res.json();

showMatches(data.data);
}

// ================= مباريات الأمس =================
async function loadYesterday(){

let res = await fetch("https://sportsrc.org/v2/football/matches?yesterday=true",{
headers:{
"x-api-key": API_KEY
}
});

let data = await res.json();

showMatches(data.data);
}

// ================= عرض المباريات =================
function showMatches(matches){

let html = "";

if(!matches || matches.length == 0){
html = "<p>❌ ماكو مباريات</p>";
}else{

matches.forEach(m=>{
html += `
<div class="card">
<h3>${m.homeTeam.name} 🆚 ${m.awayTeam.name}</h3>
<p>${m.league.name}</p>
<p>📊 ${m.score.fullTime.home} - ${m.score.fullTime.away}</p>
</div>
`;
});
}

document.getElementById("content").innerHTML = html;
}

// ================= فيديوهات =================
function loadVideos(){

document.getElementById("content").innerHTML = `
<div class="card">
<h3>🔥 أهداف اليوم</h3>
<iframe src="https://www.youtube.com/embed/3fumBcKC6RE"></iframe>
</div>

<div class="card">
<h3>⚽ ملخص مباريات</h3>
<iframe src="https://www.youtube.com/embed/tgbNymZ7vqY"></iframe>
</div>
`;
}

// ================= بحث =================
function searchTeam(){

let input = document.getElementById("search").value.toLowerCase();
let cards = document.querySelectorAll(".card");

cards.forEach(card=>{
card.style.display = card.innerText.toLowerCase().includes(input) ? "block" : "none";
});
}

// تشغيل أولي
loadLive();

</script>

</body>
</html>
