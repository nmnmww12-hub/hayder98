<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Pro MAX</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1a2f;
color:white;
}

header{
text-align:center;
padding:15px;
font-size:22px;
font-weight:bold;
}

.buttons{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
}

button{
background:#2e5bff;
border:none;
padding:10px;
border-radius:10px;
color:white;
}

.container{
padding:10px;
}

.card{
background:#1e2b45;
margin:10px 0;
padding:15px;
border-radius:15px;
}

.team{
display:flex;
justify-content:space-between;
font-size:18px;
}

.table td{
padding:8px;
border-bottom:1px solid #333;
}

</style>
</head>

<body>

<header>⚽ Football Pro MAX</header>

<div class="buttons">
<button onclick="matches()">🔴 مباريات</button>
<button onclick="table()">📊 الترتيب</button>
<button onclick="news()">📰 أخبار</button>
</div>

<div class="container" id="app"></div>

<script>

// ⚽ بيانات ديناميكية (تتغير)
let teams = [
"ريال مدريد","برشلونة","أتلتيكو مدريد","فياريال",
"ريال بيتيس","سيلتا فيغو","أوساسونا","خيتافي"
];

// 🔴 مباريات
function matches(){
let html = "";

for(let i=0;i<3;i++){
let t1 = teams[Math.floor(Math.random()*teams.length)];
let t2 = teams[Math.floor(Math.random()*teams.length)];

html += `
<div class="card">
<div class="team">
<span>${t1}</span>
<span>VS</span>
<span>${t2}</span>
</div>
<p>⏰ ${Math.floor(Math.random()*12)+1}:00</p>
<p>📊 ${Math.floor(Math.random()*5)} - ${Math.floor(Math.random()*5)}</p>
</div>
`;
}

document.getElementById("app").innerHTML = html;
}

// 📊 ترتيب
function table(){
let html = `<div class="card"><h3>🇪🇸 الدوري الإسباني</h3><table width="100%">`;

teams.forEach((team,i)=>{
html += `<tr><td>${i+1}</td><td>${team}</td><td>${Math.floor(Math.random()*80)}</td></tr>`;
});

html += `</table></div>`;

document.getElementById("app").innerHTML = html;
}

// 📰 أخبار
function news(){
document.getElementById("app").innerHTML = `
<div class="card">
<h3>🔥 خبر عاجل</h3>
<p>ريال مدريد يفوز ويواصل الصدارة!</p>
</div>

<div class="card">
<h3>⚽ برشلونة</h3>
<p>برشلونة يقدم أداء قوي هذا الموسم.</p>
</div>
`;
}

// تشغيل
matches();

// تحديث تلقائي كل 10 ثواني
setInterval(matches,10000);

</script>

</body>
</html>
