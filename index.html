<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Pro MAX</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1b2b;
color:white;
}

header{
text-align:center;
padding:15px;
font-size:22px;
font-weight:bold;
background:#0f2a44;
}

.buttons{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
padding:10px;
}

button{
background:#2d6cdf;
border:none;
color:white;
padding:10px 15px;
border-radius:10px;
cursor:pointer;
}

.search{
margin:10px;
}

.search input{
width:100%;
padding:10px;
border-radius:10px;
border:none;
}

.card{
background:#1e293b;
margin:10px;
padding:10px;
border-radius:15px;
}

iframe{
width:100%;
height:200px;
border-radius:10px;
border:none;
}
</style>
</head>

<body>

<header>⚽ Football Pro MAX</header>

<div class="buttons">
<button onclick="loadMatches()">🏆 الكل</button>
<button onclick="loadMatches('39')">🏴 إنجليزي</button>
<button onclick="loadMatches('140')">🇪🇸 إسباني</button>
<button onclick="loadLive()">🔴 مباشر</button>
<button onclick="loadHighlights()">🎥 أهداف</button>
</div>

<div class="search">
<input type="text" id="search" placeholder="ابحث عن فريق..." onkeyup="searchTeam()">
</div>

<div id="content"></div>

<script>

const API_KEY = "c14437f142msh2ab622a3c1b4063p12663ajsna8e3f9e211d5"; // ← حط مفتاحك هنا

// تحميل المباريات
async function loadMatches(league=""){
let url = "https://api-football-v1.p.rapidapi.com/v3/fixtures?season=2025";

if(league){
url += "&league="+league;
}

const res = await fetch(url,{
headers:{
"x-rapidapi-key":API_KEY,
"x-rapidapi-host":"api-football-v1.p.rapidapi.com"
}
});

const data = await res.json();
showMatches(data.response);
}

// عرض المباريات
function showMatches(matches){
let html = "";

matches.slice(0,20).forEach(match=>{
html += `
<div class="card">
<h3>${match.teams.home.name} vs ${match.teams.away.name}</h3>
<p>${match.league.name}</p>
<p>⏱ ${match.fixture.status.elapsed || "لم تبدأ"}</p>
</div>
`;
});

document.getElementById("content").innerHTML = html || "ماكو مباريات حالياً";
}

// المباريات المباشرة
async function loadLive(){
const res = await fetch("https://api-football-v1.p.rapidapi.com/v3/fixtures?live=all",{
headers:{
"x-rapidapi-key":API_KEY,
"x-rapidapi-host":"api-football-v1.p.rapidapi.com"
}
});

const data = await res.json();
showMatches(data.response);
}

// فيديوهات الأهداف (ScoreBat مجاني)
async function loadHighlights(){
const res = await fetch("https://www.scorebat.com/video-api/v3/");
const data = await res.json();

let html = "";

data.response.slice(0,10).forEach(v=>{
html += `
<div class="card">
<h3>${v.title}</h3>
<iframe src="${v.embed}"></iframe>
</div>
`;
});

document.getElementById("content").innerHTML = html;
}

// البحث
function searchTeam(){
let input = document.getElementById("search").value.toLowerCase();
let cards = document.querySelectorAll(".card");

cards.forEach(card=>{
if(card.innerText.toLowerCase().includes(input)){
card.style.display="block";
}else{
card.style.display="none";
}
});
}

// تشغيل أولي
loadMatches();

</script>

</body>
</html>
