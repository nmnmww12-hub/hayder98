<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Pro</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b1c2c;
  color:white;
}

.header {
  background:#081826;
  padding:15px;
  text-align:center;
  font-size:20px;
}

.match {
  background:#132f4c;
  margin:10px;
  padding:15px;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
}

.live {
  color:red;
  font-weight:bold;
}

.player {
  width:100%;
  height:220px;
  margin-top:10px;
}

.nav {
  position:fixed;
  bottom:0;
  width:100%;
  background:#111;
  display:flex;
  justify-content:space-around;
  padding:10px;
}

.nav button {
  background:none;
  border:none;
  color:white;
}
</style>

</head>

<body>

<div class="header">⚽ Football Live Pro</div>

<div id="matches"></div>

<div id="player"></div>

<div class="nav">
  <button onclick="loadMatches()">⚽ مباريات</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
async function loadMatches(){
  document.getElementById("matches").innerHTML = "جاري تحميل المباريات...";

  try {
    let res = await fetch("https://www.scorebat.com/video-api/v3/");
    let data = await res.json();

    let html = "";

    data.response.slice(0,10).forEach(match => {
      html += `
      <div class="match" onclick="playVideo(\`${match.videos[0].embed}\`)">
        <span>${match.title}</span>
        <span class="live">LIVE</span>
      </div>
      `;
    });

    document.getElementById("matches").innerHTML = html;

  } catch {
    document.getElementById("matches").innerHTML = "❌ خطأ بالتحميل";
  }
}

function playVideo(embed){
  document.getElementById("player").innerHTML = embed;
}

loadMatches();
</script>

</body>
</html>
