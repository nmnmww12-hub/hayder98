<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Pro MAX</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

h1{
padding:15px;
}

.buttons{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
margin:10px;
}

button{
background:#2563eb;
border:none;
padding:12px 18px;
border-radius:12px;
color:white;
font-size:16px;
cursor:pointer;
}

input{
width:90%;
padding:12px;
border-radius:10px;
border:none;
margin:10px;
font-size:16px;
}

.card{
background:#1e293b;
margin:15px;
padding:10px;
border-radius:15px;
}

iframe{
width:100%;
height:200px;
border:none;
border-radius:10px;
}
</style>
</head>

<body>

<h1>⚽ Football Pro MAX</h1>

<div class="buttons">
<button onclick="loadLive()">🔴 مباشر</button>
<button onclick="loadYesterday()">📅 مباريات الأمس</button>
<button onclick="loadVideos()">🎬 أهداف</button>
</div>

<input type="text" id="search" placeholder="🔍 ابحث عن فريق..." onkeyup="searchTeam()">

<div id="content"></div>

<script>

// 🔴 مباشر (وهمي لكن شكله قوي)
function loadLive(){
document.getElementById("content").innerHTML = `
<div class="card">
<h3>🔥 مباريات مباشرة</h3>
<p>لا يوجد بث حالياً 😅</p>
</div>
`;
}

// 📅 مباريات الأمس (مع العراق 🔥)
function loadYesterday(){
document.getElementById("content").innerHTML = `

<div class="card">
<h3>🇮🇶 العراق 🆚 بوليفيا 🇧🇴</h3>
<p>🏆 تصفيات كأس العالم</p>
<p>⏱ 90 دقيقة</p>
<p>📊 2 - 1</p>
</div>

<div class="card">
<h3>Mexico 🆚 Portugal</h3>
<iframe src="https://www.youtube.com/embed/ysz5S6PUM-U"></iframe>
</div>

<div class="card">
<h3>USA 🆚 Belgium</h3>
<iframe src="https://www.youtube.com/embed/tgbNymZ7vqY"></iframe>
</div>

`;
}

// 🎬 فيديوهات قوية
function loadVideos(){
document.getElementById("content").innerHTML = `

<div class="card">
<h3>🔥 أفضل أهداف اليوم</h3>
<iframe src="https://www.youtube.com/embed/3fumBcKC6RE"></iframe>
</div>

<div class="card">
<h3>⚽ مهارات خرافية</h3>
<iframe src="https://www.youtube.com/embed/L_jWHffIx5E"></iframe>
</div>

`;
}

// 🔍 بحث
function searchTeam(){
let input = document.getElementById("search").value.toLowerCase();
let cards = document.querySelectorAll(".card");

cards.forEach(card=>{
if(card.innerText.toLowerCase().includes(input)){
card.style.display="block";
}else{
card.style.display="none";
}
});
}

// تشغيل أولي
loadYesterday();

</script>

</body>
</html>
