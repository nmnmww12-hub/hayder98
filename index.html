<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Pro MAX</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

h1{padding:15px;}

.buttons{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
margin:10px;
}

button{
background:#2563eb;
border:none;
padding:12px 18px;
border-radius:12px;
color:white;
font-size:16px;
cursor:pointer;
}

input{
width:90%;
padding:12px;
border-radius:10px;
border:none;
margin:10px;
}

.card{
background:#1e293b;
margin:10px;
padding:15px;
border-radius:15px;
text-align:right;
}

iframe{
width:100%;
height:200px;
border:none;
border-radius:10px;
}
</style>
</head>

<body>

<h1>⚽ Football Pro MAX</h1>

<div class="buttons">
<button onclick="today()">📅 اليوم</button>
<button onclick="yesterday()">📅 الأمس</button>
<button onclick="standings()">📊 الترتيب</button>
<button onclick="videos()">🎬 أهداف</button>
</div>

<input type="text" id="search" placeholder="🔍 ابحث عن فريق..." onkeyup="searchTeam()">

<div id="content">⏳ جاري التحميل...</div>

<script>

const KEY = "e861dd443e7485299d0ec782cb1e6de1"

// 🔥 مهم (Proxy)
const BASE = "https://corsproxy.io/?https://v3.football.api-sports.io";

// 📅 اليوم
async function today(){
load("fixtures?date=2026-04-01");
}

// 📅 الأمس
async function yesterday(){
load("fixtures?date=2026-03-31");
}

// 📊 ترتيب
async function standings(){

let res = await fetch(BASE + "/standings?league=39&season=2024",{
headers:{ "x-apisports-key": KEY }
});

let data = await res.json();

let html = "";

data.response[0].league.standings[0].forEach(t=>{

html += `
<div class="card">
🏆 ${t.rank} - ${t.team.name}
<br>📊 ${t.points} نقطة
</div>
`;

});

document.getElementById("content").innerHTML = html;
}

// ⚽ تحميل مباريات
async function load(endpoint){

document.getElementById("content").innerHTML = "⏳ جاري التحميل...";

let res = await fetch(BASE + "/" + endpoint,{
headers:{ "x-apisports-key": KEY }
});

let data = await res.json();

let html = "";

data.response.slice(0,20).forEach(m=>{

html += `
<div class="card">
<h3>${m.teams.home.name} 🆚 ${m.teams.away.name}</h3>
<p>🏆 ${m.league.name}</p>
<p>⏱ ${m.fixture.status.elapsed || "لم تبدأ"}</p>
<p>📊 ${m.goals.home ?? "-"} : ${m.goals.away ?? "-"}</p>
</div>
`;

});

document.getElementById("content").innerHTML = html;
}

// 🎬 أهداف
function videos(){
document.getElementById("content").innerHTML = `

<div class="card">
<h3>🔥 أهداف مباريات</h3>
<iframe src="https://www.youtube.com/embed/3fumBcKC6RE"></iframe>
</div>

<div class="card">
<h3>⚽ ملخص مباريات</h3>
<iframe src="https://www.youtube.com/embed/tgbNymZ7vqY"></iframe>
</div>

`;
}

// 🔍 بحث
function searchTeam(){
let input = document.getElementById("search").value.toLowerCase();
let cards = document.querySelectorAll(".card");

cards.forEach(card=>{
card.style.display = card.innerText.toLowerCase().includes(input) ? "block" : "none";
});
}

// تشغيل أولي
today();

</script>

</body>
</html>
